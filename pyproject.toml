[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-codex-lights"
version = "0.3.0"
description = "Floating traffic-light panel for Claude Code and Codex CLI sessions — one dot per session showing what it is doing right now. 悬浮红绿灯面板，实时显示每个 Claude Code / Codex 会话的状态。"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "wwh0411"},
]
requires-python = ">=3.9"
dependencies = []
keywords = [
    "claude-code",
    "codex",
    "status-indicator",
    "hooks",
    "tkinter",
    "floating-panel",
    "productivity",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: User Interfaces",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/wwh0411/claude-codex-lights"
Repository = "https://github.com/wwh0411/claude-codex-lights"
Issues = "https://github.com/wwh0411/claude-codex-lights/issues"

[project.scripts]
claude-codex-lights = "claude_eyes.manager:main"
claude-codex-lights-setup = "claude_eyes.setup:main"

[tool.setuptools.packages.find]
where = ["src"]
